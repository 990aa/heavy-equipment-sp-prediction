[project]
name = "heavy-equipment-sp-prediction"
version = "0.1.0"
description = "Production-ready heavy equipment selling-price prediction pipeline"
readme = "README.md"
authors = [
    { name = "990aa", email = "099ahadabdul@gmail.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "joblib>=1.4,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
competition = [
    "lightgbm>=4.5,<5",
    "matplotlib>=3.9,<4",
    "optuna>=4,<5",
    "scipy>=1.14,<2",
    "xgboost>=2.1,<4",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[project.scripts]
heavy-equipment-sp-prediction = "heavy_equipment_sp_prediction.cli:main"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebook.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
